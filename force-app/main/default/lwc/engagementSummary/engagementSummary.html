<template>
    <lightning-card title="Engagement Summary" icon-name="standard:opportunity">
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
        </template>
        <template if:false={isLoading}>
            <div class="slds-m-around_medium">
                <div class="slds-grid slds-gutters slds-m-bottom_small">
                    <div class="slds-col">
                        <p class="slds-text-title_caps slds-text-color_weak">Related Opportunity Amount</p>
                        <p class="slds-text-heading_medium">
                            <template if:true={opportunityAmount}>{opportunityAmountFormatted}</template>
                            <template if:false={opportunityAmount}><span class="slds-text-color_weak">No opportunity linked</span></template>
                        </p>
                    </div>
                </div>
                <div class="slds-grid slds-gutters slds-m-bottom_medium">
                    <div class="slds-col slds-size_1-of-2">
                        <p class="slds-text-title_caps slds-text-color_weak">Completed Tasks</p>
                        <p class="slds-text-heading_large">{completedTaskCount}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <p class="slds-text-title_caps slds-text-color_weak">Upcoming Events</p>
                        <p class="slds-text-heading_large">{upcomingEventCount}</p>
                    </div>
                </div>
                <lightning-button label="Quick Follow-Up Call" icon-name="utility:call" variant="brand" onclick={handleFollowUpCall} disabled={isCreating}></lightning-button>
                <template if:true={successMessage}>
                    <p class="slds-text-color_success slds-m-top_small">{successMessage}</p>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
